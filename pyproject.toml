[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physgate"
version = "0.0.1"
description = "Validate LLM-generated robot plans in GPU physics simulation: best-of-N plan selection against the highest-quality verifier."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wei Cheng (Wayne) Chiu" }]
keywords = [
    "robotics", "llm-agents", "isaac-sim", "isaac-lab", "mcp",
    "ros2", "embodied-ai", "physics-simulation", "unitree-go2",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core, pure-logic dependencies only — no GPU required.
# Heavy / GPU-bound stacks (Isaac Sim/Lab, torch+cu128, ROS2) are documented in
# README and installed out-of-band, not pinned here.
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/waynehacking8/physgate"

[tool.setuptools.packages.find]
include = ["physgate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
