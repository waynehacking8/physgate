[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physgate"
version = "0.0.1"
description = "Validate LLM agent orchestration in GPU physics simulation — a dual-system architecture with deterministic navigation and a physics-verification gate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wei Cheng (Wayne) Chiu" }]
keywords = [
    "robotics", "llm-agents", "isaac-sim", "isaac-lab", "mcp",
    "ros2", "embodied-ai", "physics-simulation", "unitree-go2",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core, pure-logic dependencies only — no GPU required.
# Heavy / GPU-bound stacks (Isaac Sim/Lab, torch+cu128, ROS2) are documented in
# README and installed out-of-band, not pinned here.
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "langgraph>=0.2",
]

[project.optional-dependencies]
# dev includes everything the test suite imports, so that
# `pip install -e ".[dev]" && pytest` passes from a fresh clone (REBUILD.md Phase 4)
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mcp>=1.2", "anthropic>=0.40", "matplotlib>=3.8", "Pillow>=10.0", "rich>=13.0"]
# Claude API planner/critic (optional: mock fallback used when absent)
llm = ["anthropic>=0.40"]
# MCP server tools
mcp = ["mcp>=1.2"]

[project.urls]
Homepage = "https://github.com/waynehacking8/physgate"

[tool.setuptools.packages.find]
include = ["physgate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
